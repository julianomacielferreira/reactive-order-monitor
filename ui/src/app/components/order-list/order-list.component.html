<h3>Live Orders <span *ngIf="live" style="color:green">● LIVE</span></h3>
<table>
    <tr>
        <th>ID</th>
        <th>SKU</th>
        <th>Amt</th>
        <th>Status</th>
        <th>Created</th>
    </tr>
    <tr *ngFor="let o of list$ | async">
        <td>{{o.id}}</td>
        <td>{{o.sku}}</td>
        <td>{{o.amount}}</td>
        <td>{{o.status}}</td>
        <td>{{o.createdAt | date:'short'}}</td>
    </tr>
</table>
