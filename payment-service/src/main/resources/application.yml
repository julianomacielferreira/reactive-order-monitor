spring:
  application:
    name: payment-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/reactive_order_monitor
    username: reactive
    password: qwerty
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    io.micrometer.tracing: DEBUG
    zipkin2.reporter: DEBUG

server:
  port: 8082
